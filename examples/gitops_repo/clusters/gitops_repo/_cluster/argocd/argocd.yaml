apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.9.4
      helm:
        valueFiles:
          - $values/examples/gitops_repo/clusters/gitops_repo/_cluster/argocd/argocd.values.yaml
    - repoURL: https://github.com/ondrejsika/argocd-training.git
      ref: values
    - repoURL: https://github.com/ondrejsika/argocd-training.git
      path: examples/gitops_repo/clusters/gitops_repo/_cluster/argocd/manifests
